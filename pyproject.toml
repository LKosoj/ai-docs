[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-docs-gen"
version = "0.1.11"
description = "CLI-инструмент для генерации технической документации по коду и конфигурациям"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai",
  "httpx",
  "tiktoken",
  "pyyaml",
  "pathspec",
  "tomli",
  "python-dotenv",
  "mkdocs",
  "mkdocs-mermaid2-plugin",
  "pymdown-extensions",
]

[project.optional-dependencies]
watch = ["watchdog"]
dev = ["pytest", "ruff"]

[project.scripts]
ai-docs = "ai_docs.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["ai_docs"]
exclude = ["ai_docs.assets"]
namespaces = false

[tool.setuptools.package-data]
ai_docs = ["assets/mermaid.min.js"]
