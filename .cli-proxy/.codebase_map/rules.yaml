version: 1
node_rules:
  - id: update-nodeai-docs-site
    when:
      any_path_matches:
        - "ai_docs_site/**"
    update:
      docs:
        - "nodes/ai-docs-site.md"
    policy:
      severity: medium
      self_heal: true
  - id: update-nodeai-docs
    when:
      any_path_matches:
        - "ai_docs/**"
    update:
      docs:
        - "nodes/ai-docs.md"
    policy:
      severity: medium
      self_heal: true
  - id: update-nodetests
    when:
      any_path_matches:
        - "tests/**"
