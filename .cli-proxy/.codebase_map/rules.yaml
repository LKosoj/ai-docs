        - "run_docs_bg.sh"
    update:
      docs:
        - "nodes/run-docs-bg-sh.md"
    policy:
      severity: medium
      self_heal: true
organizational_rules:
  - id: rule-sync-ai-docs-gitignore
    kind: sync_areas
    source_class: observed
    confidence: 0.63
    status: proposed
    needs_review: true
    when:
      any_path_matches:
        - ".ai-docs"
        - ".gitignore"
    then:
      enforce_sync_with:
        - ".ai-docs"
        - ".gitignore"
    evidence:
      - "observed:git_cochange:2/71"
  - id: rule-sync-ai-docs-ai-docs-art-v4-jpg
